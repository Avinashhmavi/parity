# One container: FastAPI + the built UI. Board and sync state persist in ./data.
#   cp .env.example .env   # set FIELDOPS_API_KEY
#   docker compose up --build   ->   http://localhost:8000
services:
  board:
    build: .
    env_file: .env
    environment:
      BOARD_XLSX_PATH: /app/data/FieldServe_Board.xlsx
      BOARD_STATE_PATH: /app/data/sync_state.json
      SYNC_INTERVAL_SECONDS: "120"
    ports:
      # Published on localhost only: the console has no authentication.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
